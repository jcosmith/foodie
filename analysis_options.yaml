# Shared strict analysis options for every package in the workspace.
# Packages pick this file up automatically because the analyzer searches
# parent directories for analysis_options.yaml.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    must_be_immutable: error
    unawaited_futures: warning
  exclude:
    - "**/*.g.dart"
    - "**/generated/**"
    - "**/build/**"
    - "apps/foodie_app/android/**"
    - "apps/foodie_app/ios/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_named_constants
    - use_super_parameters
