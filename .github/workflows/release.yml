name: Release

# Pushing a version tag such as v0.1.0 publishes the GitHub release for it,
# with docs/release-notes/<version>.md as its notes (or generated ones), and attaches the Android
# release APK. If the release already exists (for example created on
# github.com together with the tag), only the APK is attached. Run it by hand
# to attach an APK to an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.6"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  android-apk:
    name: Publish the release with the Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Tag matches the app version
        run: |
          app_version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' apps/foodie_app/pubspec.yaml)
          if [ "v${app_version}" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version ${app_version} in apps/foodie_app/pubspec.yaml."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/foodie_app
        run: flutter build apk --release

      - name: Check the packaged manifest
        working-directory: apps/foodie_app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n 1)
          if "$aapt2" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
            echo "::error::The release APK requests INTERNET; data must never leave the device."
            exit 1
          fi
          if ! "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q 'allowBackup.*=false'; then
            echo "::error::The release APK allows Android backups."
            exit 1
          fi

      - name: Publish the release and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            notes="docs/release-notes/${version}.md"
            if [ -f "$notes" ]; then
              notes_options=(--notes-file "$notes")
            else
              notes_options=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Foodie ${version}" "${notes_options[@]}" --verify-tag
          fi
          apk_name="foodie-${version}.apk"
          cp apps/foodie_app/build/app/outputs/flutter-apk/app-release.apk "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"
          gh release upload "$RELEASE_TAG" "$apk_name" "$apk_name.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
