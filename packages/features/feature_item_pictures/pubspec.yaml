name: feature_item_pictures
description: Photos for products and individual batches - capture or pick, attach, view full screen, delete. Supplies thumbnails to other modules and cleans up pictures of removed items.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  core_database: any
  core_design_system: any
  core_events: any
  core_foundation: any
  core_localization: any
  core_media_storage: any
  core_module_contract: any
  feature_inventory: any
  feature_product_catalog: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  meta: ^1.16.0

dev_dependencies:
  feature_storage_layout: any
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
