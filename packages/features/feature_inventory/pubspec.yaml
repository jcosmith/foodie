name: feature_inventory
description: Stock batches in the drawers of the freezer - add, take fully or partly, discard, move, split and correct, with every change written to the movement log.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  core_database: any
  core_design_system: any
  core_events: any
  core_foundation: any
  core_localization: any
  core_module_contract: any
  feature_product_catalog: any
  feature_storage_layout: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.0.0
  intl: ^0.20.2
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
