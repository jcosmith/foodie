name: core_database
description: The single encrypted Drift database - all tables and DAOs in per-feature folders, numbered migrations with schema snapshots, SQLCipher key management and the transaction runner.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  core_foundation: any
  drift: ^2.35.0
  meta: ^1.16.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  riverpod: ^3.4.0
  sqlite3: ^3.7.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
