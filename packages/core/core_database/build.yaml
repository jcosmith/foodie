targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates are stored as ISO 8601 text in UTC, which keeps backups and
          # CSV exports readable.
          store_date_time_values_as_text: true
          databases:
            application_database: lib/src/application_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
