publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  core_database: any
  core_foundation: any
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  meta: ^1.16.0
  riverpod: ^3.4.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
